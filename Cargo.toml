[workspace]
members = [
	"car",
	"controller", "protocol",
]
resolver = "2"

[workspace.dependencies]
hal = { package = "esp-hal", version = "0.18.0", features=["esp32c3","async"] }
esp-backtrace = { version = "0.12.1", features = ["esp32c3", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.9.0", features = ["esp32c3","log","colors"] }
log = { version = "0.4.21" }
esp-alloc = { version = "0.4.0" }
esp-wifi  = { version = "0.6", features = ["esp32c3", "phy-enable-usb", "embassy-net", "async", "esp-now"] }
heapless = { version = "0.8", default-features = false }
esp-hal-embassy = { version = "0.1.0", features = ["time-timg0","esp32c3"] }
embassy-time = "0.3"
embassy-executor = { version = "0.5", features = ["integrated-timers"] }
embassy-sync = "0.6.0"
embassy-futures = "0.1"
embedded-svc = { version = "0.27", default-features = false, features = [] }
embedded-io = "0.6"
embedded-hal = { version="1.0.0" }
embedded-hal-async = "1.0.0"
embedded-io-async = { version = "0.6.0" }

postcard = { version = "1.0.8", default-features = false, features = ["postcard-derive", "alloc"] }
serde = { version = "1.0.193", default-features = false, features = ["alloc", "serde_derive"] }
